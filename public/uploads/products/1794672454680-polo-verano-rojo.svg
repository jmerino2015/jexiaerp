<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <radialGradient id="poloShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="poloRedBody" x1="100" y1="80" x2="300" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="poloSleeveL" x1="60" y1="100" x2="130" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="poloSleeveR" x1="340" y1="100" x2="270" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="collarGrad" x1="160" y1="70" x2="240" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
  </defs>

  <!-- Sombra base -->
  <ellipse cx="200" cy="360" rx="140" ry="20" fill="url(#poloShadow)" />

  <!-- Manga Izquierda -->
  <path d="M125 105 L65 155 C60 160 55 175 60 185 L85 200 C92 204 102 200 106 192 L132 145 Z" fill="url(#poloSleeveL)" stroke="#991B1B" stroke-width="2" />
  <path d="M60 185 L85 200 C88 202 93 200 95 197 L92 190 L67 175 Z" fill="#7F1D1D" />

  <!-- Manga Derecha -->
  <path d="M275 105 L335 155 C340 160 345 175 340 185 L315 200 C308 204 298 200 294 192 L268 145 Z" fill="url(#poloSleeveR)" stroke="#991B1B" stroke-width="2" />
  <path d="M340 185 L315 200 C312 202 307 200 305 197 L308 190 L333 175 Z" fill="#7F1D1D" />

  <!-- Cuerpo Principal del Polo -->
  <path d="M130 100 L160 85 C175 100 225 100 240 85 L270 100 C275 125 272 160 268 200 L275 330 C275 335 270 340 265 340 L135 340 C130 340 125 335 125 330 L132 200 C128 160 125 125 130 100 Z" fill="url(#poloRedBody)" stroke="#991B1B" stroke-width="2" />

  <!-- Dobladillo Inferior -->
  <path d="M125 330 L275 330 L275 340 L125 340 Z" fill="#7F1D1D" opacity="0.6" />

  <!-- Plaqueta Central de Botones -->
  <path d="M188 95 L212 95 L210 180 C210 184 206 188 200 188 C194 188 190 184 190 180 Z" fill="#7F1D1D" stroke="#991B1B" stroke-width="1.5" />
  <circle cx="200" cy="115" r="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <circle cx="200" cy="140" r="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <circle cx="200" cy="165" r="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Cuello Camisero Tipo Polo -->
  <path d="M160 85 C170 95 190 98 198 95 L185 140 C183 145 178 145 175 140 L145 105 Z" fill="url(#collarGrad)" stroke="#450A0A" stroke-width="2" />
  <path d="M240 85 C230 95 210 98 202 95 L215 140 C217 145 222 145 225 140 L255 105 Z" fill="url(#collarGrad)" stroke="#450A0A" stroke-width="2" />

  <!-- Detalle Bordado en el Pecho -->
  <g transform="translate(150, 136) scale(0.4)">
    <rect x="0" y="18" width="6" height="12" rx="3" fill="#F97316" />
    <rect x="9" y="12" width="6" height="18" rx="3" fill="#FFFFFF" />
    <rect x="18" y="2" width="6" height="28" rx="3" fill="#10B981" />
  </g>

  <!-- Badge Talla L y Algodón -->
  <g transform="translate(275, 45)">
    <rect width="90" height="28" rx="14" fill="#0F172A" />
    <text x="45" y="18" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">TALLA L • ROJO</text>
  </g>
</svg>
